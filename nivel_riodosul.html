<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor do Rio Itajaí-Açu | Rio do Sul</title>
<meta name="description" content="Monitoramento em tempo real do nível do Rio Itajaí-Açu em Rio do Sul, SC. Dados oficiais da Defesa Civil de Santa Catarina.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563eb;--success:#16a34a;--warning:#ca8a04;--danger:#dc2626;--bg:#f8fafc;--card-bg:#fff;--text:#1e293b;--text-light:#64748b}html,body{overflow:hidden;overscroll-behavior:none;max-width:100%;}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',sans-serif;background-color:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}.container{background:var(--card-bg);width:100%;max-width:480px;border-radius:24px;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 10px 10px -5px rgba(0,0,0,.04);overflow:hidden;text-align:center;position:relative}.header{background:linear-gradient(135deg,#1e40af 0%,#3b82f6 100%);color:#fff;padding:30px 20px}.header h1{font-size:1.5rem;font-weight:800;margin-bottom:5px}.header p{opacity:.9;font-size:.9rem}.content{padding:30px 20px}.level-display{margin:20px 0;position:relative}.level-value{font-size:5rem;font-weight:800;line-height:1;color:var(--text);letter-spacing:-2px}.level-unit{font-size:1.5rem;color:var(--text-light);font-weight:600;vertical-align:super}.status-badge{display:flex;width:max-content;margin:0 auto;align-items:center;gap:8px;padding:8px 16px;border-radius:50px;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px}.status-normal{background:#dcfce7;color:var(--success)}.status-alerta{background:#fef9c3;color:var(--warning)}.status-critico{background:#fee2e2;color:var(--danger);animation:pulse-red 2s infinite}.details{margin-top:25px;padding-top:20px;border-top:1px solid #e2e8f0;font-size:.85rem;color:var(--text-light)}.loading-spinner{width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}.error-box{background:#fef2f2;color:var(--danger);padding:20px;border-radius:12px;margin:20px 0;font-size:.9rem}.btn-retry{background:var(--primary);color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:15px;transition:transform .1s}.btn-retry:active{transform:scale(.98)}footer{margin-top:30px;font-size:.75rem;color:#94a3b8;text-align:center}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse-red{0%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}70%{box-shadow:0 0 0 10px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card-bg:#1e293b;--text:#f1f5f9;--text-light:#94a3b8}.level-value{color:#f1f5f9}.details{border-color:#334155}.status-normal{background:#14532d;color:#86efac}.status-alerta{background:#713f12;color:#fde047}.status-critico{background:#7f1d1d;color:#fca5a5}}
.trend-indicator{display:flex;width:max-content;margin:15px auto 10px;align-items:center;gap:6px;padding:8px 16px;border-radius:50px;font-weight:700;font-size:.85rem;transition:all .3s ease}.trend-up{background:#fee2e2;color:#dc2626;border:1px solid #fecaca}.trend-down{background:#dcfce7;color:#16a34a;border:1px solid #bbf7d0}.trend-stable{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}.trend-indicator span{font-size:1.2rem;font-weight:800}@media (prefers-color-scheme:dark){.trend-up{background:#7f1d1d;color:#fca5a5;border-color:#991b1b}.trend-down{background:#14532d;color:#86efac;border-color:#166534}.trend-stable{background:#334155;color:#94a3b8;border-color:#475569}}
</style></head><body><div class="container"><div class="header"><h1>Rio Itajaí-Açu</h1><p>Rio do Sul, Santa Catarina</p></div><div class="content" id="main-content"><div class="loading-spinner"></div><p style="color:var(--text-light);margin-top:15px">Conectando aos sensores...</p></div></div><footer></footer>
<script>
const WS_URL='wss://monitoramento.defesacivil.sc.gov.br/graphql';
const CLIENT='secretaria-de-defesa-civil';
const TARGET_CODE='00013';
const CURRENT_QUERY=`query Tags_data { tags_data(clients: ["${CLIENT}"]) { qualle_meteorologia { codigo name { prefix general local } show timestamp position { bacia latitude longitude regiao altitude } data { rio { rio_nome { value } rio_nivel { value show { value } format { value } unit { value } } rio_nivel_tendencia { value show { value } } homologacao { relacao { valido { value } } } } } } } }`;
const HISTORY_QUERY=`query Historic($stationCode: String!, $startDate: String!, $endDate: String!, $interval: QueryInterval) { historic(system: Qualle_Hidrometeorologia, client: "${CLIENT}", stationCode: $stationCode, startDate: $startDate, endDate: $endDate, interval: $interval, opts: { ordenacao: ASC }) }`;
const contentDiv=document.getElementById('main-content'); let ws=null,seq=0,pending=new Map();
function raw(v){return v&&typeof v==='object'&&'value' in v?v.value:v}
function num(v){v=raw(v);if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)?n:null}
function txt(v){v=raw(v);return v==null?'':String(v)}
function request(query,variables={}){return new Promise((resolve,reject)=>{if(!ws||ws.readyState!==WebSocket.OPEN)return reject(new Error('WebSocket indisponível'));const id=String(++seq);const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Tempo esgotado'))},20000);pending.set(id,{resolve,reject,timer});ws.send(JSON.stringify({id,type:'subscribe',payload:{query,variables}}))})}
function connect(){return new Promise((resolve,reject)=>{if(ws&&ws.readyState===WebSocket.OPEN)return resolve();ws=new WebSocket(WS_URL,'graphql-transport-ws');let ack=false;ws.onopen=()=>ws.send(JSON.stringify({type:'connection_init',payload:{}}));ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='ping'){try{ws.send(JSON.stringify({type:'pong'}))}catch{}return}if(m.type==='connection_ack'){ack=true;resolve();return}const p=pending.get(String(m.id??''));if(!p)return;if(m.type==='next'){clearTimeout(p.timer);pending.delete(String(m.id));p.resolve(m.payload?.data??m.payload)}else if(m.type==='error'){clearTimeout(p.timer);pending.delete(String(m.id));p.reject(new Error(JSON.stringify(m.payload)))}};ws.onerror=()=>{if(!ack)reject(new Error('Falha na conexão WebSocket'))};ws.onclose=()=>{for(const [id,p] of pending){clearTimeout(p.timer);p.reject(new Error('Conexão fechada'));pending.delete(id)}ws=null}})}
function localDateTime(d){const parts=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{});return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`}
function parseHistory(rawHistory){let data=rawHistory;if(typeof data==='string'){try{data=JSON.parse(data)}catch{}}
const out=[];const seen=new Set();function walk(x){if(!x)return;if(Array.isArray(x)){x.forEach(walk);return}if(typeof x!=='object')return;
let ts=x.timestamp??x.horaLeitura??x.datetime??x.dateTime??x.dataHora??x.data_hora??x.time??x.date;let lv=x.rio_nivel??x.rioNivel??x.nivel??x.value??x.valor;
if(ts&&lv!=null){const d=new Date(ts);const n=num(lv);if(!isNaN(d.getTime())&&n!=null){const key=d.getTime()+'|'+n;if(!seen.has(key)){seen.add(key);out.push({time:d.getTime(),level:n})}}}
for(const v of Object.values(x))walk(v)}walk(data);return out.sort((a,b)=>a.time-b.time)}
async function getHistory(){
const now=new Date();
const start=new Date(now.getTime()-4*60*60*1000);
const result=await request(HISTORY_QUERY,{
 stationCode:TARGET_CODE,
 startDate:localDateTime(start),
 endDate:localDateTime(now),
 interval:'HOUR_1'
});
return parseHistory(result?.historic??result);
}
async function tryFetchData(){contentDiv.innerHTML='<div class="loading-spinner"></div><p style="color:var(--text-light);margin-top:15px">Buscando dados oficiais...</p>';try{await connect();const result=await request(CURRENT_QUERY);const stations=result?.tags_data?.qualle_meteorologia;const arr=Array.isArray(stations)?stations:Object.values(stations||{});let station=arr.find(s=>String(s?.codigo??'').trim()===TARGET_CODE);if(!station)station=arr.find(s=>/rio do sul/i.test([s?.name?.prefix,s?.name?.general,s?.name?.local].map(txt).join(' ')));if(!station)throw new Error('Estação SDC Rio do Sul - 00013 não encontrada');let history=[];try{history=await getHistory()}catch(e){console.warn('Histórico oficial indisponível:',e)}renderData(station,history)}catch(err){console.warn(err);showError()}}
function renderData(station,history){const rio=station?.data?.rio;const nivelRecebido=num(rio?.rio_nivel?.show?.value)??num(rio?.rio_nivel?.value);if(nivelRecebido==null){showError();return}
// Ajuste local de calibração de Rio do Sul: desconta 15 cm da leitura recebida.
// Exemplo: 1,15 m recebido -> 1,00 m exibido.
const nivel=Math.max(0,nivelRecebido-0.15);let statusClass='status-normal',statusText='Nível Normal';if(nivel>=6.5){statusClass='status-critico';statusText='EMERGÊNCIA'}else if(nivel>=5.5){statusClass='status-critico';statusText='ALERTA'}else if(nivel>=4.5){statusClass='status-alerta';statusText='ATENÇÃO'}
let tendenciaHTML='';
const now=Date.now();
const alvo=now-60*60*1000;
// Procura a leitura histórica mais próxima de exatamente 1 hora atrás.
// A mesma correção de -0,15 m é aplicada aos dois lados da comparação,
// portanto ela não altera a variação, apenas o nível exibido.
const candidatos=history
 .filter(p=>Number.isFinite(p.time)&&Number.isFinite(p.level))
 .map(p=>({...p,dist:Math.abs(p.time-alvo)}))
 .sort((a,b)=>a.dist-b.dist);
const ref=candidatos.length&&candidatos[0].dist<=35*60*1000?candidatos[0]:null;
let variacao=null;
if(ref){
 const nivelUmaHoraAtras=Math.max(0,ref.level-0.15);
 variacao=nivel-nivelUmaHoraAtras;
 if(variacao>0.005)tendenciaHTML=`<div class="trend-indicator trend-up"><span>↑</span> Subindo ${Math.abs(variacao).toFixed(2)}m/h</div>`;
 else if(variacao<-0.005)tendenciaHTML=`<div class="trend-indicator trend-down"><span>↓</span> Descendo ${Math.abs(variacao).toFixed(2)}m/h</div>`;
 else tendenciaHTML='<div class="trend-indicator trend-stable"><span>→</span> Estável</div>';
}else{
 const tendencia=txt(rio?.rio_nivel_tendencia?.show?.value??rio?.rio_nivel_tendencia?.value);
 const t=tendencia.toLowerCase();
 if(t.includes('sub')||t.includes('alta')||t.includes('up'))tendenciaHTML='<div class="trend-indicator trend-up"><span>↑</span> Subindo</div>';
 else if(t.includes('desc')||t.includes('baixa')||t.includes('down'))tendenciaHTML='<div class="trend-indicator trend-down"><span>↓</span> Descendo</div>';
 else tendenciaHTML='<div class="trend-indicator trend-stable"><span>→</span> Estável</div>';
}
const timestamp=station?.timestamp;let formattedDate='Horário não informado';if(timestamp&&!isNaN(new Date(timestamp).getTime()))formattedDate=new Date(timestamp).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});contentDiv.innerHTML=`<div class="level-display"><span class="level-value">${nivel.toFixed(2)}</span><span class="level-unit">m</span></div>${tendenciaHTML}<div class="status-badge ${statusClass}">${statusText}</div><div class="details"><p><strong>Última leitura:</strong> ${formattedDate}</p><p style="margin-top:8px"><strong>Variação (1h):</strong> ${variacao==null?'0.00m':(variacao>0?'+':'')+variacao.toFixed(2)+'m'}</p></div>`}
function showError(){contentDiv.innerHTML='<div class="error-box"><p><strong>Não foi possível obter os dados.</strong></p><p style="font-size:.8rem;margin-top:5px;opacity:.8">A rede oficial da Defesa Civil pode estar indisponível no momento.</p></div><button class="btn-retry" onclick="tryFetchData()">Tentar Novamente</button>'}
tryFetchData();setInterval(tryFetchData,120000);
</script></body></html>
