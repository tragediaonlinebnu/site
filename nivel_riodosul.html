<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor do Rio Itajaí-Açu | Rio do Sul</title>
    <meta name="description" content="Monitoramento em tempo real do nível do Rio Itajaí-Açu em Rio do Sul, SC. Dados oficiais da Defesa Civil de Santa Catarina.">
    
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --warning: #ca8a04;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
        }

        html, body {
            overflow-x: hidden;
            overscroll-behavior: none;
            max-width: 100%;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: white;
            padding: 25px 20px;
        }

        .header h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 3px; }
        .header p { opacity: 0.9; font-size: 0.85rem; }

        .content { padding: 35px 20px; }

        .level-display {
            margin: 15px 0;
        }

        .level-value {
            font-size: 4.8rem;
            font-weight: 800;
            line-height: 1;
            color: var(--text);
            letter-spacing: -2px;
        }

        .level-unit {
            font-size: 1.4rem;
            color: var(--text-light);
            font-weight: 600;
            vertical-align: super;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 12px;
        }

        .status-normal { background: #dcfce7; color: var(--success); }
        .status-alerta { background: #fef9c3; color: var(--warning); }
        .status-critico { background: #fee2e2; color: var(--danger); animation: pulse-red 2s infinite; }

        .details {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.85rem;
            color: var(--text-light);
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .details p {
            display: flex;
            justify-content: space-between;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }

        .error-box {
            background: #fef2f2;
            color: var(--danger);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 0.9rem;
        }

        .btn-retry {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.1s;
        }
        .btn-retry:active { transform: scale(0.98); }

        footer {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
            padding-bottom: 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        @media (prefers-color-scheme: dark) {
            :root { --bg: #0f172a; --card-bg: #1e293b; --text: #f1f5f9; --text-light: #94a3b8; }
            .level-value { color: #f1f5f9; }
            .details { border-color: #334155; }
            .status-normal { background: #14532d; color: #86efac; }
            .status-alerta { background: #713f12; color: #fde047; }
            .status-critico { background: #7f1d1d; color: #fca5a5; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Rio Itajaí-Açu</h1>
            <p>Rio do Sul, Santa Catarina</p>
        </div>

        <div class="content" id="main-content">
            <div class="loading-spinner"></div>
            <p style="color: var(--text-light); margin-top: 15px;">Buscando dados da Defesa Civil...</p>
        </div>
    </div>

    <footer>
        Fonte: Defesa Civil de Santa Catarina<br>
        Atualização automática a cada 5 minutos
    </footer>

    <script>
        const API_URL = 'https://monitoramento.defesacivil.sc.gov.br/graphql';
        const CLIENT = 'secretaria-de-defesa-civil';
        const TARGET_CODE = '00013';

        const CURRENT_QUERY = `query Tags_data { tags_data(clients: ["${CLIENT}"]) { qualle_meteorologia { codigo name { prefix general local } show timestamp position { bacia latitude longitude regiao altitude } data { rio { rio_nome { value } rio_nivel { value show { value } format { value } unit { value } } homologacao { relacao { valido { value } } } } } } } }`;

        const contentDiv = document.getElementById('main-content');

        function raw(v) { return v && typeof v === 'object' && 'value' in v ? v.value : v; }
        function num(v) { v = raw(v); if (v == null || v === '') return null; const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; }
        function txt(v) { v = raw(v); return v == null ? '' : String(v); }

        async function fetchRiverData() {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: CURRENT_QUERY })
                });

                if (!response.ok) throw new Error('Erro na requisição HTTP');
                const json = await response.json();
                if (json.errors) throw new Error(json.errors[0].message);

                const stations = json.data?.tags_data?.qualle_meteorologia;
                const arr = Array.isArray(stations) ? stations : Object.values(stations || {});
                let station = arr.find(s => String(s?.codigo ?? '').trim() === TARGET_CODE);
                if (!station) station = arr.find(s => /rio do sul/i.test([s?.name?.prefix, s?.name?.general, s?.name?.local].map(txt).join(' ')));
                if (!station) throw new Error('Estação SDC Rio do Sul - 00013 não encontrada');
                
                const rio = station?.data?.rio;
                const nivelRecebido = num(rio?.rio_nivel?.show?.value) ?? num(rio?.rio_nivel?.value);
                if (nivelRecebido == null) throw new Error('Nível indisponível');

                const nivel = Math.max(0, nivelRecebido - 0.14);
                
                renderData(station, nivel);
            } catch (err) {
                console.warn(err);
                showError();
            }
        }

        function renderData(station, nivel) {
            let statusClass = 'status-normal', statusText = 'Nível Normal';
            if (nivel >= 6.5) {
                statusClass = 'status-critico'; statusText = 'EMERGÊNCIA';
            } else if (nivel >= 5.5) {
                statusClass = 'status-critico'; statusText = 'ALERTA';
            } else if (nivel >= 4.5) {
                statusClass = 'status-alerta'; statusText = 'ATENÇÃO';
            }

            const timestamp = station?.timestamp;
            let formattedDate = 'Agora mesmo';
            if (timestamp && !isNaN(new Date(timestamp).getTime())) {
                formattedDate = new Date(timestamp).toLocaleString('pt-BR', {
                    day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                });
            }

            contentDiv.innerHTML = `
                <div class="level-display">
                    <span class="level-value">${nivel.toFixed(2)}</span>
                    <span class="level-unit">m</span>
                </div>
                
                <div class="status-badge ${statusClass}">
                    ${statusText}
                </div>

                <div class="details">
                    <p><span>Última leitura:</span> <strong>${formattedDate}</strong></p>
                </div>
            `;
        }

        function showError() {
            contentDiv.innerHTML = `
                <div class="error-box">
                    <p><strong>Não foi possível carregar os dados.</strong></p>
                    <p style="font-size:.8rem;margin-top:5px;opacity:.8">Verifique sua conexão.</p>
                </div>
                <button class="btn-retry" onclick="fetchRiverData()">Tentar Novamente</button>
            `;
        }

        fetchRiverData();
        setInterval(fetchRiverData, 300000);
    </script>
</body>
</html>
