name: Atualizar maré de Itajaí

on:
  workflow_dispatch:
  schedule:
    # Executa a cada 1 hora
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: tide-itajai-update
  cancel-in-progress: false

jobs:
  update-tide:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow pytesseract

      - name: Instalar OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      # ==========================================================
      # MARÉ DE ITAJAÍ
      # ==========================================================
      # Setembro/2026
      # No próximo mês, altere somente:
      #
      # MARE-9.jpg -> MARE-10.jpg
      #
      # ==========================================================

      - name: Baixar tábua de maré
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests

          url = "https://defesacivil.itajai.sc.gov.br/wp-content/uploads/2026/08/MARE-9.jpg"

          output = Path("data/mare_itajai.jpg")
          output.parent.mkdir(parents=True, exist_ok=True)

          print(f"Baixando tábua de maré: {url}")

          response = requests.get(
              url,
              timeout=30,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          response.raise_for_status()

          if not response.content:
              raise SystemExit(
                  "ERRO: imagem da maré vazia."
              )

          output.write_bytes(response.content)

          print(f"OK: imagem salva em {output}")
          print(f"Tamanho: {len(response.content)} bytes")
          PY

      # ==========================================================
      # OCR
      # ==========================================================

      - name: Executar leitura OCR da maré
        run: |
          python scripts/update_tide.py

      # ==========================================================
      # VALIDAR MARÉ
      # ==========================================================

      - name: Validar maré
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/mare_itajai.json")

          if not path.exists():
              raise SystemExit(
                  "ERRO: data/mare_itajai.json não foi gerado."
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERRO: mare_itajai.json não contém um objeto JSON."
              )

          events = data.get("events")

          if not isinstance(events, list):
              raise SystemExit(
                  "ERRO: campo 'events' inválido na maré."
              )

          print(
              f"OK: mare_itajai.json válido — "
              f"{len(events)} eventos encontrados."
          )
          PY

      # ==========================================================
      # SALVAR MARÉ
      # ==========================================================

      - name: Salvar maré com sincronização segura
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME}"

          git fetch origin "$BRANCH"
          git rebase --autostash "origin/$BRANCH"

          git add \
            data/mare_itajai.jpg \
            data/mare_itajai.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração na maré para salvar."
            exit 0
          fi

          git commit -m "Atualiza mare de Itajai"

          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "Push realizado com sucesso."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "ERRO: não foi possível realizar o push após 3 tentativas."
              exit 1
            fi

            echo "Push falhou. Sincronizando novamente..."

            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH"
          done
