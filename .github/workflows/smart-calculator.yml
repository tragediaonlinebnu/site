name: Smart Hydrology Collector

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-learn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests websockets

      - name: Collect data and learn
        run: |
          python scripts/collect_and_learn.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              "data/dam_history.json",
              "data/learning.json",
              "data/learning_snapshots.json",
              "data/learning_status.json",
              "data/river_history.json",
              "data/hydrology_events.json",
              "data/hydrology_status.json",
          ]

          for file in files:
              path = Path(file)

              if not path.exists():
                  raise FileNotFoundError(f"Arquivo não encontrado: {file}")

              with path.open(encoding="utf-8") as f:
                  json.load(f)

              print(f"OK: {file}")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
          else
            git commit -m "chore: atualização hidrológica automática"
            git push
          fi
