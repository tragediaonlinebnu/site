name: Aprendizado da calculadora do rio

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: smart-calculator-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests websockets

      - name: Coletar dados e aprender
        run: |
          python scripts/collect_and_learn.py

      - name: Validar dados persistidos
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path

          files = [
              "data/learning.json",
              "data/learning_status.json",
              "data/learning_snapshots.json",
              "data/river_history.json",
              "data/dam_history.json",
          ]

          for name in files:
              path = Path(name)

              if not path.exists():
                  raise SystemExit(f"Arquivo ausente: {name}")

              with path.open(encoding="utf-8") as f:
                  json.load(f)

              print(f"OK: {name}")
          PYCODE

      - name: Gravar aprendizado no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/learning.json \
            data/learning_status.json \
            data/learning_snapshots.json \
            data/river_history.json \
            data/dam_history.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Atualizar aprendizado da calculadora"
            git push
          fi
