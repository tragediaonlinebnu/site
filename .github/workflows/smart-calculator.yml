name: Aprendizado da calculadora do rio

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

jobs:
  learn:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install requests websockets

      - name: Coletar dados e aprender
        run: python scripts/collect_and_learn.py

      - name: Gravar aprendizado no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Atualizar aprendizado da calculadora"
          git push
