name: Aprendizado da calculadora do rio

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests websockets

      - name: Coletar dados e aprender
        run: python scripts/collect_and_learn.py

      - name: Gravar aprendizado no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/learning.json data/learning_status.json data/learning_snapshots.json data/river_history.json
          git diff --cached --quiet || git commit -m "Atualiza aprendizado da calculadora"
          git push
